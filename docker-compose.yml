volumes:
  vol-emqx-data:
    name: foo-emqx-data
  vol-emqx-log:
    name: foo-emqx-log
  iot_pg_data:
    driver: local

networks:
  iot:
    name: host_iot
    driver: bridge

services:
  ## POSTGRES
  iot_pg:
    image: postgres:16.3-alpine3.20
    container_name: iot_pg
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - iot_pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - ${DATABASE_PORT}:5432
    networks:
      iot:
        aliases:
          - iot_pg_host
 ## BROKER EMQX
  iot_emqx:
    image: emqx/emqx-enterprise:5.10.3
    container_name: iot_emqx
    depends_on:
      - iot_pg
    restart: always
    ports:
      - 1883:1883
      - 8083:8083
      - 8084:8084
      - 8883:8883
      - 18083:18083
      - 18084:18084
    environment:
      TZ: ${TZ}
      EMQX_NAME: iot-gammaautomations
      EMQX_HOST: 127.0.0.1
      EMQX_NODE__COOKIE: 'mycookieemqxyhp'
      EMQX_DASHBOARD__DEFAULT_PASSWORD: 'emqxpassword'
      EMQX_DASHBOARD__LISTENERS__HTTPS__BIND: '0.0.0.0:18084'
      EMQX_DASHBOARD__LISTENERS__HTTPS__SSL_OPTIONS__CERTFILE: '/opt/emqx/etc/certs/cert.pem'
      EMQX_DASHBOARD__LISTENERS__HTTPS__SSL_OPTIONS__KEYFILE: '/opt/emqx/etc/certs/key.pem'
      EMQX_DASHBOARD__LISTENERS__HTTPS__SSL_OPTIONS__CACERTFILE: '/opt/emqx/etc/certs/cacert.pem'
    volumes:
      - vol-emqx-data:/opt/emqx/data
      - vol-emqx-log:/opt/emqx/log
      - ./certs:/opt/emqx/etc/certs
    extra_hosts:
      - 'localhost:192.168.1.30'
    networks:
      iot:
        aliases:
          - iot_emqx_host
    

